course:
  title: "CIS 501: Reframing Problems with AI"
  lead: "Find your current sprint and continue your work."
  footer: "Computing Talent Initiative - De Anza College - CIS 501: Reframing Problems with AI"
schedule:
  timezone: America/Los_Angeles
  start_date: '2026-10-05'
  sprint_days: 14
  orientation_sprint: 6
  help_slug: help-and-resources-v2
  sprints:
    - number: 1
      sprint: 12
      ready: true
      title: "Find the problem worth solving"
      summary: "Use your own observations to compare candidate problems and explain which one is worth investigating."
      note: "First half available. Work without AI in this half."
    - number: 2
      sprint: null
      ready: false
      title: "Direct AI deliberately"
      summary: "Give AI context, compare its suggestions, and record the judgment behind your choices."
    - number: 3
      sprint: 7
      ready: true
      title: "Integrate people and context"
      summary: "Talk with a real stakeholder and revise your problem frame using what you learn."
    - number: 4
      sprint: 8
      ready: true
      title: "Close the learning gap"
      summary: "Learn what your problem requires and check the claims you will rely on."
    - number: 5
      sprint: 9
      ready: false
      title: "Synthesize and show readiness"
      summary: "Connect your problem frame, stakeholder input, and learning evidence into one supported argument."
modules:
  - sprint: 0
    hidden: true
    tag: "Orientation"
    open: true
    learning_goals:
      - "Understand what the course is, how it is paced, and what a good goal looks like."
      - "Choose the real goal you will carry through all five sprints."
      - "Set up your Dojo access and know where to find how-to guides, the glossary, and troubleshooting."
    prereq: "Start here before Sprint 1. Nothing is submitted from this module."
    groups:
      - label: "Start here"
        items:
          - slug: "welcome-start-here"
            meta: "Page - what the course is, how it is paced, choosing your goal, and how you use AI"
      - label: "Come back to these anytime"
        items:
          - slug: "tutorials-and-resources"
            meta: "Page - the hub of how-to guides, reference, and troubleshooting"
          - slug: "dojo-setup-and-how-to"
            meta: "Page - get your Symbiotic Thinking Dojo access working"
          - slug: "submitting-your-work-in-canvas"
            meta: "Page - where and how you turn work in"
          - slug: "downloading-and-uploading-your-json"
            meta: "Page - export a Dojo session and upload it"
          - slug: "key-terms-glossary"
            meta: "Page - definitions used across the course"
          - slug: "the-five-artifact-map"
            meta: "Page - the full-course arc as a reference"
          - slug: "how-ai-is-used-in-this-course"
            meta: "Page - the fuller AI-use statement and Symbiotic Thinking explainer"
          - slug: "troubleshooting"
            meta: "Page - fixes for rate limits and browser-tab overload"

  - sprint: 1
    hidden: true
    tag: "Framing"
    open: true
    learning_goals:
      - "Move from a broad goal or surface request to a problem that is specific enough to test."
      - "Use AI to widen and challenge your thinking without handing it final judgment."
      - "Create a problem frame grounded in real people, constraints, and evidence."
    prereq: "Start with a real goal from work, job search, community work, caregiving, learning, or another setting where actual people are affected."
    groups:
      - label: "Sprint Week 1: Start here"
        items:
          - slug: "start-here-frame-what-is-worth-solving"
            meta: "Information page - orient to the sprint, portfolio thread, and completion criteria"
      - label: "Sprint Week 1: Build the frame"
        items:
          - slug: "concept-from-goal-to-problem"
            meta: "Page - distinguish goals, surface requests, and underlying problems"
          - slug: "how-to-get-help-with-your-problem-frame"
            meta: "Page - use peers, stakeholders, instructors, and AI to sharpen a problem frame"
          - slug: "pre-dojo-goal-pause"
            meta: "Assignment - write your own first thoughts before asking AI"
          - slug: "dojo-lab-abstraction-ladder"
            meta: "Dojo activity - use the Symbiotic Thinking Dojo to move between concrete examples, patterns, causes, and purpose"
      - label: "Sprint Week 2: Test and submit"
        items:
          - slug: "peer-exchange-what-problem-sits-beneath-it"
            meta: "AI activity - use follow-up questions to sharpen the problem beneath the goal"
          - slug: "goal-plan-and-problem-reframing-document"
            meta: "Assignment - submit the problem frame you will carry forward"
          - slug: "problem-framing-check"
            meta: "AI self-check - apply the goal-to-problem distinction to your own frame"
            badge: "Self-check"
            selfcheck: true
            verify: "Ask another person to read the problem statement and name what they think you are actually trying to solve."
          - slug: "sprint-1-reflection-what-changed"
            meta: "AI reflection activity - refine what changed between your starting goal and your current problem frame"

  - sprint: 2
    hidden: true
    tag: "AI Direction"
    open: false
    learning_goals:
      - "Give AI enough context, constraints, and standards to make its output useful."
      - "Judge AI suggestions instead of accepting the first fluent answer."
      - "Document how your choices improved the work."
    prereq: "Builds on the problem frame from Sprint 1. AI can help only after you can explain what needs to be explored."
    groups:
      - label: "Sprint Week 1: Start here"
        items:
          - slug: "start-here-direct-ai-deliberately"
            meta: "Page - orient to deliberate AI direction and the sprint rhythm"
      - label: "Sprint Week 1: Practice direction"
        items:
          - slug: "concept-context-choices-confirmation"
            meta: "Page - learn the context, choices, and confirmation pattern"
          - slug: "dojo-lab-3cs-exploration-round-1"
            meta: "Dojo activity - run a focused Symbiotic Thinking Dojo exploration round on your real problem"
          - slug: "ai-output-assessment-and-pushback"
            meta: "Assignment - push back on weak, generic, or unverified AI output"
      - label: "Sprint Week 2: Compare, check, and reflect"
        items:
          - slug: "peer-exchange-which-ai-suggestion-would-you-not-trust-yet"
            meta: "AI activity - test what remains unverified in a plausible AI suggestion"
          - slug: "ai-exploration-log-and-3cs-application-log"
            meta: "Assignment - preserve prompts, choices, outputs, and judgment calls"
          - slug: "directing-ai-check"
            meta: "AI self-check - refine context, choices, and confirmation for one AI interaction"
            badge: "Self-check"
            selfcheck: true
            verify: "Show one AI output and your pushback notes to a peer. Ask whether your standard is clear."
          - slug: "sprint-2-reflection-my-judgment-improved-the-output"
            meta: "AI reflection activity - refine where your judgment changed the result"

  - sprint: 3
    hidden: true
    tag: "People and Context"
    open: false
    learning_goals:
      - "Identify stakeholders and their relationship to the problem."
      - "Design validation questions for stakeholders that produce real evidence."
      - "Revise the problem frame using human input and context."
    prereq: "Builds on your Sprint 2 AI exploration. This sprint asks what actual people and settings confirm, complicate, or change."
    groups:
      - label: "Sprint Week 1: Start here"
        items:
          - slug: "start-here-integrate-people-and-context"
            meta: "Page - orient to stakeholder evidence and context"
      - label: "Sprint Week 1: Map and prepare"
        items:
          - slug: "concept-stakeholders-needs-constraints-and-validation"
            meta: "Page - distinguish stakeholder needs, constraints, and validation"
          - slug: "dojo-lab-stakeholder-lens-preparation"
            meta: "Dojo activity - use the Symbiotic Thinking Dojo to prepare better stakeholder questions"
          - slug: "stakeholder-map-draft"
            meta: "Assignment - draft who is affected, who can validate, and what matters to each group"
      - label: "Sprint Week 2: Validate and revise"
        items:
          - slug: "peer-exchange-validation-questions"
            meta: "AI activity - improve stakeholder questions before you ask them"
          - slug: "stakeholder-validation-report"
            meta: "Assignment - report what you learned from real stakeholder work"
          - slug: "stakeholder-validation-check"
            meta: "AI self-check - test whether your validation plan seeks evidence, not approval"
            badge: "Self-check"
            selfcheck: true
            verify: "Ask a real stakeholder or peer to identify one assumption your questions may still carry."
          - slug: "sprint-3-reflection-and-mid-course-goal-plan-revision"
            meta: "AI reflection activity - refine your goal plan revision based on evidence"

  - sprint: 4
    hidden: true
    tag: "Learning Gap"
    open: false
    learning_goals:
      - "Name the knowledge gaps that block stronger work on the problem."
      - "Use AI to design a focused learning path without outsourcing the learning."
      - "Show evidence that your learning changed what you can now do."
    prereq: "Builds on validated stakeholder and context evidence. Learn only what the problem now proves you need."
    groups:
      - label: "Sprint Week 1: Start here"
        items:
          - slug: "start-here-close-the-learning-gap"
            meta: "Page - orient to focused self-directed learning"
      - label: "Sprint Week 1: Plan the learning"
        items:
          - slug: "concept-self-directed-learning-with-ai"
            meta: "Page - use AI as a learning partner while keeping your own standards"
          - slug: "knowledge-gap-inventory"
            meta: "Assignment - identify what you need to know and why it matters"
          - slug: "dojo-lab-learning-path-design"
            meta: "Dojo activity - design a practical learning path with Symbiotic Thinking Dojo support"
      - label: "Sprint Week 2: Apply, compare, and check"
        items:
          - slug: "peer-exchange-what-are-you-choosing-not-to-learn"
            meta: "AI activity - test whether a learning exclusion is strategic and responsible"
          - slug: "self-learning-journey-and-learning-plan"
            meta: "Assignment - show the learning path and what it changed"
          - slug: "self-directed-learning-check"
            meta: "AI self-check - refine a focused, verifiable learning plan"
            badge: "Self-check"
            selfcheck: true
            verify: "Have someone ask how each learning step helps the actual problem, not just your general curiosity."
          - slug: "sprint-4-reflection-what-i-learned-and-how-i-know"
            meta: "AI reflection activity - refine what you learned and what evidence proves it"

  - sprint: 5
    hidden: true
    tag: "Synthesis"
    open: false
    learning_goals:
      - "Turn course artifacts into a coherent argument about the problem and your readiness."
      - "Identify gaps in evidence, logic, and stakeholder grounding before final submission."
      - "Submit a final integrated problem document that a reader can follow."
    prereq: "Builds on the full course portfolio. Synthesis works when your artifacts show real changes in judgment, evidence, and scope."
    groups:
      - label: "Sprint Week 1: Start here"
        items:
          - slug: "start-here-synthesize-and-show-readiness"
            meta: "Page - orient to the final synthesis and readiness standard"
      - label: "Sprint Week 1: Draft the argument"
        items:
          - slug: "concept-from-artifacts-to-argument"
            meta: "Page - connect artifacts into a claim a reader can follow"
          - slug: "dojo-lab-synthesis-gap-audit"
            meta: "Dojo activity - use the Symbiotic Thinking Dojo to find gaps without letting it write the argument"
          - slug: "integrated-problem-document-draft"
            meta: "Assignment - draft the integrated problem document"
      - label: "Sprint Week 2: Review, submit, and close"
        items:
          - slug: "peer-review-can-a-reader-follow-the-argument"
            meta: "AI activity - test whether a reader can follow your readiness argument"
          - slug: "final-integrated-problem-document-and-readiness-report"
            meta: "Assignment - submit the final integrated document and readiness report"
          - slug: "closing-reflection-and-final-goal-plan-check"
            meta: "AI reflection activity - close the loop on your goal plan"
          - slug: "readiness-self-check"
            meta: "AI self-check - refine an evidence-backed readiness judgment"
            badge: "Self-check"
            selfcheck: true
            verify: "Walk a peer or stakeholder through the argument before final submission and note where they get lost."

  - sprint: 6
    order: 0
    title: "Welcome and orientation"
    tag: "Orientation"
    open: false
    learning_goals:
      - "Say what you will produce by the end of the course, and how the five sprints build toward it."
      - "Know what the course asks of you each week, and decide how you will fit it in."
      - "Recognize the two ideas the course rests on, Superagency and Human Value, and how you work with AI as a thinking partner."
      - "Know where to go when you are stuck."
    groups:
      - label: "Read these in order"
        items:
          - slug: "start-here-v2"
            meta: "Page - module landing page: what this module covers and what to do first"
          - slug: "welcome-v2"
            meta: "Page - what the course is, who it is for, and what you walk out with"
          - slug: "how-this-course-works-v2"
            meta: "Page - the five sprints, the weekly rhythm, and how you turn work in"
          - slug: "your-first-week-v2"
            meta: "Page - a short checklist, ending in the one thing you submit"
      - label: "The one submission"
        items:
          - slug: "introduction-post-v2"
            meta: "Discussion - post a short introduction and read a few others; complete or incomplete, 0 points, peer replies optional"
      - label: "Come back to this anytime"
        items:
          - slug: "help-and-resources-v2"
            meta: "Page - how-tos, key terms, and how to reach your instructor"

  - sprint: 7
    order: 3
    title: "Sprint 3: Integrate people and context"
    tag: "People and context"
    open: false
    learning_goals:
      - "Identify stakeholders and their relationship to the problem."
      - "Design validation questions for stakeholders that produce real evidence."
      - "Revise the problem framing using human input and context."
    prereq: "A reviewed, consolidated rebuild of Sprint 3, kept separate from the original Sprint 3 for comparison."
    groups:
      - label: "Sprint Week 1: Understand and map"
        items:
          - slug: "introduction-integrate-people-and-context-v2"
            meta: "Page - how stakeholders, evidence, and validation work in this sprint"
          - slug: "sprint-3-concept-check-v2"
            meta: "Practice quiz - check your understanding before you start; ungraded, unlimited attempts"
            badge: "Self-check"
            selfcheck: true
          - slug: "dojo-lab-stakeholder-map-v2"
            meta: "Assignment - profile your stakeholders with the Dojo and mark what you know"
      - label: "Sprint Week 2: Validate and revise"
        items:
          - slug: "stakeholder-conversation-v2"
            meta: "Assignment - prepare, hold, and document a real stakeholder conversation"
          - slug: "sprint-3-reflection-and-mid-course-goal-plan-revision-v2"
            meta: "AI reflection activity - refine your goal plan revision based on evidence"

  - sprint: 8
    order: 4
    title: "Sprint 4: Close the learning gap"
    tag: "Learning gap"
    open: false
    learning_goals:
      - "Name the gap that is blocking your next move, and tell it apart from something you are simply curious about."
      - "Design a focused learning path that has an end point you can point at."
      - "Check an important claim against evidence, and say what the check returned."
    prereq: "A rebuild of Sprint 4, kept separate from the original Sprint 4. Starts from the gap your Sprint 3 conversation opened up."
    groups:
      - label: "Sprint Week 1: Name the gap"
        items:
          - slug: "introduction-close-the-learning-gap-v3"
            meta: "Page - what separates a gap from a topic, and an explanation from evidence"
          - slug: "sprint-4-concept-check-v3"
            meta: "Practice quiz - check your understanding before you start; ungraded, unlimited attempts"
            badge: "Self-check"
            selfcheck: true
          - slug: "name-the-gap-v3"
            meta: "Assignment - write your own gap list and commit to one, before any AI"
          - slug: "ai-exchange-is-this-a-gap-v3"
            meta: "AI exchange activity - test whether your committed gap is really a gap"
      - label: "Sprint Week 2: Plan, learn, and check"
        items:
          - slug: "dojo-lab-design-the-learning-path-v3"
            meta: "Assignment - sequence the learning with the Dojo and design the two checks"
          - slug: "learn-and-check-v3"
            meta: "Assignment - run the path and check two claims against something that is not AI"
          - slug: "sprint-4-reflection-what-i-learned-and-how-i-know-v3"
            meta: "AI reflection activity - name the capability you gained and what you checked"

  - sprint: 9
    order: 5
    title: "Sprint 5: Synthesize and show readiness"
    tag: "Synthesis"
    open: false
    learning_goals:
      - "Turn course artifacts into a coherent argument about the problem and your readiness."
      - "Identify gaps in evidence, logic, and stakeholder grounding before final submission."
      - "Submit a final integrated problem document that a reader can follow."
    prereq: "A rebuild of Sprint 5, kept separate from the original Sprint 5. Placeholder module: the activities are still being written."
    groups:
      - label: "Sprint Week 1: Start here"
        items:
          - slug: "introduction-synthesize-and-show-readiness-v2"
            meta: "Page - placeholder stub for the Sprint 5 rebuild"

  - sprint: 12
    order: 1
    title: "Sprint 1: Find the problem worth solving"
    tag: "First half"
    open: true
    muted: false
    learning_goals:
      - "Use observations, work-arounds, and requests from your own work or life to uncover gaps worth investigating."
      - "Describe three to five candidate problems from your working table, naming who pays the cost and marking what you do not yet know."
      - "Compare candidates using four checks: real people, current handling, current occurrence, and a size that supports further inquiry."
      - "Explain your choice of a problem with reasons and a runner-up, or identify where to look next if nothing survives."
    prereq: "Only the first half of Sprint 1 is available here, ending with Test and commit. The Introduction also describes second-half work that is not yet available. Start with your own observations; you do not need a chosen problem. Keep one table across these activities and carry your choice into later framing. Work without AI in this half. The three own-your-progress activities are encouraged, carry zero points, and do not block later activities if skipped."
    groups:
      - label: "Introduction"
        items:
          - slug: "introduction-find-the-problem-worth-solving-v2"
            meta: "Page - orient to candidate problems, the four checks, and the first-half sequence"
      - label: "Build your table"
        items:
          - slug: "start-your-list-and-get-underneath-it-v2"
            meta: "Guided assignment - build your three-column table from your own observations, then copy and submit in Canvas; 0 points, encouraged"
          - slug: "things-you-stopped-noticing-v2"
            meta: "Guided assignment - watch for work-arounds over a day or two, then copy and submit your updated table or report no new observations in Canvas; 0 points, encouraged"
          - slug: "things-somebody-handed-you-v2"
            meta: "Guided assignment - trace requests to goals and add possible problems to the same table, then copy and submit in Canvas; 0 points, encouraged"
      - label: "Check and commit"
        items:
          - slug: "sprint-1-concept-check-v2"
            meta: "Guided concept check - answer six questions, review explanations, then copy and submit final answers in Canvas; 5 completion points reviewed by your instructor, no automatic grading"
            badge: "Self-check"
            selfcheck: true
          - slug: "test-and-commit-v2"
            meta: "Guided assignment - select three to five candidate gaps, run four checks, and explain your choice with reasons and a runner-up or recovery plan; copy and submit once in Canvas, 35 points reviewed by your instructor"
