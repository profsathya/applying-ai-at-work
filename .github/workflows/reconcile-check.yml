name: Nightly reconcile check

on:
  schedule:
    - cron: '0 7 * * *'  # 7 AM UTC daily (midnight Pacific)
  workflow_dispatch:

jobs:
  reconcile-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r canvas_sync/requirements.txt

      - name: Run dry-run reconcile against all course manifests
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          set -e
          drift_found=0
          for manifest in course*/manifests/*.json; do
            echo "=== Checking $manifest ==="
            python canvas_sync/pull.py --manifest "$manifest" --dry-run > /tmp/drift.json || true
            drifted=$(jq '.drifted' /tmp/drift.json)
            if [ "$drifted" -gt 0 ]; then
              echo "::warning::Drift detected in $manifest: $drifted artifacts"
              cat /tmp/drift.json
              drift_found=1
            fi
          done
          exit "$drift_found"

      - name: Create issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Canvas drift detected',
              body: 'The nightly reconcile check found drift between canvas and local MD. Run `/reconcile` locally to review and apply.',
              labels: ['drift']
            })
