name: Nightly Canvas drift check

on:
  schedule:
    - cron: '0 7 * * *'  # 7 AM UTC daily (midnight Pacific)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content branch
        uses: actions/checkout@v4
        with:
          path: content

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: content/canvas_sync/requirements.txt

      - name: Install deps
        working-directory: content
        run: pip install -r canvas_sync/requirements.txt

      - name: Check out canvas-state branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir canvas-state
          cd canvas-state
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin canvas-state
          git checkout -B canvas-state FETCH_HEAD

      - name: Check Canvas credentials
        id: canvas_credentials
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CANVAS_API_URL:-}" ] && [ -n "${CANVAS_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Canvas credentials are not configured. Drift check skipped."
          fi

      - name: Run drift check against external state
        if: steps.canvas_credentials.outputs.available == 'true'
        working-directory: content
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          set -o pipefail
          python canvas_sync/check_drift.py \
            --all-manifests \
            --state-dir ../canvas-state | tee /tmp/canvas-drift.json

      - name: Create issue on drift
        if: failure() && steps.canvas_credentials.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = 'No drift output was captured.';
            try {
              details = fs.readFileSync('/tmp/canvas-drift.json', 'utf8');
            } catch (error) {}
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Canvas drift detected',
              body: `The nightly Canvas drift check found differences between Canvas, main, and canvas-state.\n\n\`\`\`json\n${details.slice(0, 60000)}\n\`\`\``,
              labels: ['drift']
            })
