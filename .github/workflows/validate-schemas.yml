name: Validate schemas

on:
  pull_request:
    paths:
      - 'course*/**'
      - '.github/workflows/**'
      - 'schema/**'
      - 'canvas_sync/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'course*/**'
      - '.github/workflows/**'
      - 'schema/**'
      - 'canvas_sync/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: canvas_sync/requirements.txt

      - name: Install deps
        run: pip install -r canvas_sync/requirements.txt

      - name: Run schema validation on all artifacts
        run: python canvas_sync/schema.py --all

      - name: Compile sync scripts
        run: python -m py_compile canvas_sync/*.py

      - name: Run unit tests
        run: python -m unittest discover
