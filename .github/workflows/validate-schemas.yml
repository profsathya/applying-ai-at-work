name: Validate schemas

on:
  pull_request:
    paths:
      - 'course*/**'
      - '.github/workflows/**'
      - 'schema/**'
      - 'canvas_sync/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'course*/**'
      - '.github/workflows/**'
      - 'schema/**'
      - 'canvas_sync/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: canvas_sync/requirements.txt

      - name: Install deps
        run: pip install -r canvas_sync/requirements.txt

      - name: Run schema validation on all artifacts
        run: python canvas_sync/schema.py --all

      - name: Compile sync scripts
        run: python -m py_compile canvas_sync/*.py

      - name: Render hosted homepage preview
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from canvas_sync.hosted_html import discover_artifact_files, render_hosted_files

          output_dir = Path("/tmp/aiaw-homepage-preview")
          for manifest in sorted(Path(".").glob("course*/manifests/production.json")):
              data = json.loads(manifest.read_text(encoding="utf-8"))
              if (data.get("hosted_html") or {}).get("enabled"):
                  render_hosted_files(manifest, output_dir, discover_artifact_files(manifest))
          PY

      - name: Run unit tests
        run: python -m unittest discover
