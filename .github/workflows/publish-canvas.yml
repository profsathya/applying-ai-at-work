name: Publish Canvas

on:
  push:
    branches: [main]
    paths:
      - 'course*/sprints/**'
      - 'course*/manifests/production.json'
      - '.github/workflows/publish-canvas.yml'
      - 'schema/**'
      - 'canvas_sync/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      course:
        description: 'Course key to publish, for example course1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canvas-publish-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_targets: ${{ steps.target_manifests.outputs.has_targets }}
      manifests: ${{ steps.target_manifests.outputs.manifests }}
    steps:
      - name: Check out content branch
        uses: actions/checkout@v4
        with:
          path: content
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: content/canvas_sync/requirements.txt

      - name: Install deps
        working-directory: content
        run: pip install -r canvas_sync/requirements.txt

      - name: Validate content
        working-directory: content
        run: |
          python canvas_sync/schema.py --all
          python -m unittest discover

      - name: Resolve target manifests
        id: target_manifests
        working-directory: content
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_COURSE: ${{ inputs.course }}
        run: |
          set -euo pipefail
          manifests_file="$(mktemp)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            manifest="${INPUT_COURSE}/manifests/production.json"
            if [ ! -f "$manifest" ]; then
              echo "::error::Manifest not found: $manifest"
              exit 1
            fi
            printf '%s\n' "$manifest" > "$manifests_file"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" \
              | awk -F/ '/^course[0-9]+\/(sprints\/|manifests\/production.json)/ { print $1 "/manifests/production.json" }' \
              | sort -u \
              | while IFS= read -r manifest; do
                  [ -f "$manifest" ] && printf '%s\n' "$manifest"
                done > "$manifests_file"
          fi

          if [ ! -s "$manifests_file" ]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "manifests=" >> "$GITHUB_OUTPUT"
            echo "::notice::No course content changes detected; skipping Canvas publish."
            exit 0
          fi

          echo "has_targets=true" >> "$GITHUB_OUTPUT"
          {
            echo "manifests<<EOF"
            cat "$manifests_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Target manifests:"
          cat "$manifests_file"

  publish:
    needs: validate
    if: needs.validate.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    environment: canvas-production
    permissions:
      contents: write
    steps:
      - name: Check out content branch
        uses: actions/checkout@v4
        with:
          path: content
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: content/canvas_sync/requirements.txt

      - name: Install deps
        working-directory: content
        run: pip install -r canvas_sync/requirements.txt

      - name: Check out or initialize canvas-state branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir canvas-state
          cd canvas-state
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin canvas-state >/dev/null 2>&1; then
            git fetch --depth=1 origin canvas-state
            git checkout -B canvas-state FETCH_HEAD
          else
            git checkout --orphan canvas-state
            git rm -rf . >/dev/null 2>&1 || true
            printf "# Canvas State\n\nMutable Canvas deployment state. Updated by GitHub Actions.\n" > README.md
            git add README.md
            git commit -m "init canvas state"
            git push origin HEAD:canvas-state
          fi
          if [ ! -f .gitignore ] || ! grep -qxF '*.lock' .gitignore; then
            printf '%s\n' '*.lock' >> .gitignore
          fi

      - name: Bootstrap missing state files from legacy manifests
        working-directory: content
        env:
          TARGET_MANIFESTS: ${{ needs.validate.outputs.manifests }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r manifest; do
            [ -n "$manifest" ] && args+=(--manifest "$manifest")
          done <<< "$TARGET_MANIFESTS"
          python canvas_sync/bootstrap_state.py "${args[@]}" --state-dir ../canvas-state --skip-existing

      - name: Check Canvas credentials
        id: canvas_credentials
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CANVAS_API_URL:-}" ] && [ -n "${CANVAS_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Canvas credentials are not configured. Add CANVAS_API_URL and CANVAS_API_TOKEN to the canvas-production environment before publishing."
            exit 1
          fi

      - name: Hydrate missing Canvas fingerprints
        if: steps.canvas_credentials.outputs.available == 'true'
        working-directory: content
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          TARGET_MANIFESTS: ${{ needs.validate.outputs.manifests }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r manifest; do
            [ -n "$manifest" ] && args+=(--manifest "$manifest")
          done <<< "$TARGET_MANIFESTS"
          python canvas_sync/hydrate_state.py "${args[@]}" --state-dir ../canvas-state

      - name: Publish changed artifacts
        id: publish
        if: steps.canvas_credentials.outputs.available == 'true'
        continue-on-error: true
        working-directory: content
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          TARGET_MANIFESTS: ${{ needs.validate.outputs.manifests }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r manifest; do
            [ -n "$manifest" ] && args+=(--manifest "$manifest")
          done <<< "$TARGET_MANIFESTS"
          set -o pipefail
          python canvas_sync/publish_changed.py \
            "${args[@]}" \
            --state-dir ../canvas-state \
            --check-drift \
            --require-state | tee ../publish-result.json

      - name: Validate state files
        id: validate_state
        if: always()
        working-directory: content
        run: |
          set -euo pipefail
          shopt -s nullglob
          for state_file in ../canvas-state/course*/production.json; do
            python canvas_sync/schema.py --state "$state_file"
          done

      - name: Commit canvas-state changes
        if: always() && steps.validate_state.outcome == 'success'
        working-directory: canvas-state
        run: |
          set -euo pipefail
          find . -name '*.lock' -type f -delete
          git add .
          if git diff --cached --quiet; then
            echo "No canvas-state changes to commit."
          else
            git commit -m "sync canvas state for ${GITHUB_SHA}"
            git push origin HEAD:canvas-state
          fi

      - name: Fail if publish reported errors
        if: steps.canvas_credentials.outputs.available == 'true' && steps.publish.outcome == 'failure'
        run: |
          echo "Publish step failed. Result:"
          cat publish-result.json 2>/dev/null || true
          exit 1
