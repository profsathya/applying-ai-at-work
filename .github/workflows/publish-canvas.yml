name: Publish Canvas

on:
  push:
    branches: [main]
    paths:
      - 'course*/sprints/**'
      - 'course*/homepage.yaml'
      - 'course*/manifests/production.json'
      - '.github/workflows/publish-canvas.yml'
      - 'schema/**'
      - 'canvas_sync/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      course:
        description: 'Course key to publish, for example course1'
        required: true
        type: string
      hosted_only:
        description: 'Render and commit hosted output without Canvas reads or writes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: canvas-publish-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_targets: ${{ steps.target_manifests.outputs.has_targets }}
      manifests: ${{ steps.target_manifests.outputs.manifests }}
    steps:
      - name: Check out content branch
        uses: actions/checkout@v4
        with:
          path: content
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: content/canvas_sync/requirements.txt

      - name: Install deps
        working-directory: content
        run: pip install -r canvas_sync/requirements.txt

      - name: Validate content
        working-directory: content
        run: |
          python canvas_sync/schema.py --all
          python -m unittest discover

      - name: Resolve target manifests
        id: target_manifests
        working-directory: content
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_COURSE: ${{ inputs.course }}
        run: |
          set -euo pipefail
          manifests_file="$(mktemp)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            manifest="${INPUT_COURSE}/manifests/production.json"
            if [ ! -f "$manifest" ]; then
              echo "::error::Manifest not found: $manifest"
              exit 1
            fi
            printf '%s\n' "$manifest" > "$manifests_file"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" \
              | awk -F/ '/^course[0-9]+\/(sprints\/|homepage.yaml|manifests\/production.json)/ { print $1 "/manifests/production.json" }' \
              | sort -u \
              | while IFS= read -r manifest; do
                  if [ -f "$manifest" ]; then
                    printf '%s\n' "$manifest"
                  fi
                done > "$manifests_file"
          fi

          if [ ! -s "$manifests_file" ]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "manifests=" >> "$GITHUB_OUTPUT"
            echo "::notice::No course content changes detected; skipping Canvas publish."
            exit 0
          fi

          echo "has_targets=true" >> "$GITHUB_OUTPUT"
          {
            echo "manifests<<EOF"
            cat "$manifests_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Target manifests:"
          cat "$manifests_file"

  publish:
    needs: validate
    if: needs.validate.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    environment: canvas-production
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      HOSTED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_only == true }}
    steps:
      - name: Check out content branch
        uses: actions/checkout@v4
        with:
          path: content
          fetch-depth: 0

      - name: Check out Common Curriculum
        uses: actions/checkout@v4
        with:
          repository: profsathya/Common-Curriculum
          path: common-curriculum
          fetch-depth: 0
          token: ${{ secrets.COMMON_CURRICULUM_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: content/canvas_sync/requirements.txt

      - name: Install deps
        working-directory: content
        run: pip install -r canvas_sync/requirements.txt

      - name: Check out or initialize canvas-state branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir canvas-state
          cd canvas-state
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin canvas-state >/dev/null 2>&1; then
            git fetch --depth=1 origin canvas-state
            git checkout -B canvas-state FETCH_HEAD
          else
            git checkout --orphan canvas-state
            git rm -rf . >/dev/null 2>&1 || true
            printf "# Canvas State\n\nMutable Canvas deployment state. Updated by GitHub Actions.\n" > README.md
            git add README.md
            git commit -m "init canvas state"
            git push origin HEAD:canvas-state
          fi
          if [ ! -f .gitignore ] || ! grep -qxF '*.lock' .gitignore; then
            printf '%s\n' '*.lock' >> .gitignore
          fi

      - name: Bootstrap missing state files from legacy manifests
        if: env.HOSTED_ONLY != 'true'
        working-directory: content
        env:
          TARGET_MANIFESTS: ${{ needs.validate.outputs.manifests }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r manifest; do
            [ -n "$manifest" ] && args+=(--manifest "$manifest")
          done <<< "$TARGET_MANIFESTS"
          python canvas_sync/bootstrap_state.py "${args[@]}" --state-dir ../canvas-state --skip-existing

      - name: Check Canvas credentials
        id: canvas_credentials
        if: env.HOSTED_ONLY != 'true'
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CANVAS_API_URL:-}" ] && [ -n "${CANVAS_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Canvas credentials are not configured. Add CANVAS_API_URL and CANVAS_API_TOKEN to the canvas-production environment before publishing."
            exit 1
          fi

      - name: Hydrate missing Canvas fingerprints
        if: env.HOSTED_ONLY != 'true' && steps.canvas_credentials.outputs.available == 'true'
        working-directory: content
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          TARGET_MANIFESTS: ${{ needs.validate.outputs.manifests }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r manifest; do
            [ -n "$manifest" ] && args+=(--manifest "$manifest")
          done <<< "$TARGET_MANIFESTS"
          python canvas_sync/hydrate_state.py "${args[@]}" --state-dir ../canvas-state

      - name: Publish changed artifacts
        id: publish
        if: env.HOSTED_ONLY == 'true' || steps.canvas_credentials.outputs.available == 'true'
        continue-on-error: true
        working-directory: content
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          TARGET_MANIFESTS: ${{ needs.validate.outputs.manifests }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r manifest; do
            [ -n "$manifest" ] && args+=(--manifest "$manifest")
          done <<< "$TARGET_MANIFESTS"
          hosted_args=()
          if [ "$HOSTED_ONLY" = "true" ]; then
            hosted_args+=(--hosted-only)
          fi
          set -o pipefail
          python canvas_sync/publish_changed.py \
            "${args[@]}" \
            --state-dir ../canvas-state \
            --hosted-output-dir ../common-curriculum \
            --check-drift \
            --require-state \
            "${hosted_args[@]}" --report-file ../publish-result.json


      - name: Determine publish outcome
        id: outcome
        if: env.HOSTED_ONLY == 'true' || steps.canvas_credentials.outputs.available == 'true'
        working-directory: content
        env:
          TARGET_MANIFESTS: ${{ needs.validate.outputs.manifests }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, ".")
          from canvas_sync.publish_outcome import summarize_report

          expected = len(
              [line for line in os.environ.get("TARGET_MANIFESTS", "").splitlines() if line.strip()]
          )
          try:
              with open("../publish-result.json", encoding="utf-8") as fh:
                  report = json.load(fh)
          except (OSError, ValueError):
              report = None
          summary = summarize_report(report, expected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"published_count={summary['published']}\n")
              out.write(f"failed_count={summary['failed']}\n")
              out.write(f"commit_state={str(summary['commit_state']).lower()}\n")
              out.write(f"hosted_commit={str(summary['hosted_commit']).lower()}\n")
          print(summary)
          PY

      - name: Commit Common Curriculum hosted changes
        id: hosted
        if: (env.HOSTED_ONLY == 'true' || steps.canvas_credentials.outputs.available == 'true') && steps.outcome.outputs.hosted_commit == 'true'
        working-directory: common-curriculum
        env:
          COMMON_CURRICULUM_TOKEN: ${{ secrets.COMMON_CURRICULUM_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deanza career-intelligence activities
          if git diff --cached --quiet; then
            echo "cc_pushed=true" >> "$GITHUB_OUTPUT"
            echo "No Common Curriculum hosted changes to commit."
            exit 0
          fi
          if [ -z "${COMMON_CURRICULUM_TOKEN:-}" ]; then
            echo "cc_pushed=false" >> "$GITHUB_OUTPUT"
            echo "::error::COMMON_CURRICULUM_TOKEN is required to push hosted Common Curriculum files."
            exit 0
          fi
          git commit -m "sync hosted canvas output for ${GITHUB_SHA}"
          git remote set-url origin "https://x-access-token:${COMMON_CURRICULUM_TOKEN}@github.com/profsathya/Common-Curriculum.git"
          if git push origin HEAD:main; then
            echo "cc_pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cc_pushed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Pushing hosted Common Curriculum files failed."
          fi

      - name: Reconcile content-only state with hosted deploy
        if: always() && (env.HOSTED_ONLY == 'true' || steps.canvas_credentials.outputs.available == 'true') && steps.hosted.outputs.cc_pushed != 'true'
        working-directory: content
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from canvas_sync.publish_outcome import demote_hosted_publishes, revert_entries

          report = Path("../publish-result.json")
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              raise SystemExit(0)

          adjusted, demoted = demote_hosted_publishes(data.get("results", []))
          state_root = Path("../canvas-state").resolve()
          for state_path, artifact_ids in demoted.items():
              state_file = Path(state_path)
              rel = state_file.resolve().relative_to(state_root).as_posix()
              show = subprocess.run(
                  ["git", "-C", str(state_root), "show", f"HEAD:{rel}"],
                  capture_output=True,
                  text=True,
              )
              baseline = json.loads(show.stdout) if show.returncode == 0 else {"artifacts": {}}
              current = json.loads(state_file.read_text(encoding="utf-8"))
              reverted = revert_entries(current, baseline, artifact_ids)
              state_file.write_text(
                  json.dumps(reverted, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
          data["results"] = adjusted
          report.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"content-only state entries reverted: {sum(len(v) for v in demoted.values())}")
          PY

      - name: Determine final outcome
        id: outcome_final
        if: always() && (env.HOSTED_ONLY == 'true' || steps.canvas_credentials.outputs.available == 'true')
        working-directory: content
        env:
          TARGET_MANIFESTS: ${{ needs.validate.outputs.manifests }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, ".")
          from canvas_sync.publish_outcome import summarize_report

          expected = len(
              [line for line in os.environ.get("TARGET_MANIFESTS", "").splitlines() if line.strip()]
          )
          try:
              with open("../publish-result.json", encoding="utf-8") as fh:
                  report = json.load(fh)
          except (OSError, ValueError):
              report = None
          summary = summarize_report(report, expected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"published_count={summary['published']}\n")
              out.write(f"failed_count={summary['failed']}\n")
              out.write(f"commit_state={str(summary['commit_state']).lower()}\n")
              out.write(f"hosted_commit={str(summary['hosted_commit']).lower()}\n")
          print(summary)
          PY

      - name: Validate state files
        id: validate_state
        if: always()
        working-directory: content
        run: |
          set -euo pipefail
          shopt -s nullglob
          for state_file in ../canvas-state/course*/production.json; do
            python canvas_sync/schema.py --state "$state_file"
          done

      - name: Commit canvas-state changes
        if: always() && steps.validate_state.outcome == 'success' && steps.outcome_final.outputs.commit_state == 'true'
        working-directory: canvas-state
        run: |
          set -euo pipefail
          find . -name '*.lock' -type f -delete
          git add .
          if git diff --cached --quiet; then
            echo "No canvas-state changes to commit."
          else
            git commit -m "sync canvas state for ${GITHUB_SHA}"
            git push origin HEAD:canvas-state
          fi


      - name: Post plain-language publish result
        if: always() && (env.HOSTED_ONLY == 'true' || steps.canvas_credentials.outputs.available == 'true')
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const post = async (body) => {
              try {
                const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                });
                const merged = prs.data.find((pr) => pr.merge_commit_sha === context.sha) || prs.data[0];
                if (merged) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: merged.number,
                    body,
                  });
                  return;
                }
              } catch (error) {
                core.info(`PR lookup failed, falling back to commit comment: ${error.message}`);
              }
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
            };
            let data;
            try {
              data = JSON.parse(fs.readFileSync('publish-result.json', 'utf8'));
            } catch (error) {
              await post('**Canvas publish result**\n\n❌ The publish run failed before producing results. Check the Publish Canvas workflow logs.');
              return;
            }
            if (!data.completed) {
              await post('**Canvas publish result**\n\n❌ The publish run stopped before finishing. Check the Publish Canvas workflow logs.');
              return;
            }
            const lines = [];
            for (const result of data.results || []) {
              for (const item of result.published || []) {
                const label = item.file || item.artifact_id;
                if (item.action === 'content_update') {
                  lines.push(`✅ ${label} - deployment queued - usually live within a few minutes`);
                } else if (item.hosted_url) {
                  lines.push(`✅ ${label} - Canvas updated - hosted page deployment queued`);
                } else {
                  lines.push(`✅ ${label} - live (Canvas updated)`);
                }
                for (const warning of item.warnings || []) {
                  lines.push(`⚠️ ${label} - ${warning}`);
                }
              }
              for (const item of result.drifted || []) {
                lines.push(`❌ ${item.file} - not published - ${item.reason}`);
              }
              for (const item of result.failed || []) {
                const reason = String(item.error || 'unknown error').split('\n')[0].slice(0, 200);
                lines.push(`❌ ${item.file} - not published - ${reason}`);
              }
            }
            if (!lines.length) {
              core.info('No changed artifacts; skipping result comment.');
              return;
            }
            await post(['**Canvas publish result**', '', ...lines].join('\n'));

      - name: Fail if publish reported errors
        if: (env.HOSTED_ONLY == 'true' || steps.canvas_credentials.outputs.available == 'true') && (steps.publish.outcome == 'failure' || steps.outcome_final.outputs.failed_count != '0' || steps.hosted.outputs.cc_pushed == 'false')
        run: |
          echo "Publish reported per-item problems:"
          python3 - <<'PY'
          import json

          try:
              with open("publish-result.json", encoding="utf-8") as fh:
                  data = json.load(fh)
          except (OSError, ValueError):
              print("  (publish produced no readable result file)")
              raise SystemExit(0)
          for result in data.get("results", []):
              for item in result.get("failed", []):
                  reason = str(item.get("error", "unknown error")).splitlines()[0]
                  print(f"  FAILED  {item.get('file')}: {reason}")
              for item in result.get("drifted", []):
                  print(f"  BLOCKED {item.get('file')}: {item.get('reason')}")
              for item in result.get("published", []):
                  print(f"  OK      {item.get('file') or item.get('artifact_id')}")
          PY
          exit 1
